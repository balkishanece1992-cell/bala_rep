name: Deploy RG

on:
 push:
   branches:
     - main
  # workflow_dispatch:

jobs:
  deploy_RG:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init- krega
        working-directory: ./
        run: terraform init

      - name: Terraform Validate - krega
        working-directory: ./
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./
        run: terraform apply -auto-approve
